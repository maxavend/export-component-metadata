<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.copy{position:absolute;left:160px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
.page{position:absolute;left:1236px;top:120px;width:524px;height:840px;border-radius:20px;background:#fff;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.05),0 20px 48px rgba(30,20,90,.10)}
.page .bar{height:52px;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid #ECECF0;font:500 15px/1 Inter;color:var(--grey)}
.page .bar i{width:11px;height:11px;border-radius:50%;background:#E3E3E8}
.page .bar span{margin-left:12px}
.doc{padding:34px 40px;font:500 18px/1.55 Inter;color:#2C2C2E}
.doc h1{font-size:38px;letter-spacing:-0.02em;padding-bottom:14px;border-bottom:1px solid #ECECF0;margin:0 0 22px}
.doc h2{font:600 24px/1.2 Inter;letter-spacing:-0.01em;margin:26px 0 12px}
.doc ul{margin:0;padding-left:22px}.doc p{margin:0 0 16px}.doc strong{font-weight:600;color:var(--graphite)}
.doc code{font:500 15px ui-monospace,"SF Mono",Menlo,monospace;background:#F2F2F7;border-radius:5px;padding:2px 5px}
.page::after{content:"";position:absolute;left:0;right:0;bottom:0;height:140px;background:linear-gradient(rgba(255,255,255,0),#fff)}
</style></head><body>
<div class="copy">
  <div class="eyebrow"><img src="../../brand/symbol/symbol-color.svg" alt="">Export Component Metadata</div>
  <h1>Copy it. Paste it. Done.</h1>
  <p class="lede">Copy puts the Markdown on your clipboard, ready for your docs; Export saves the JSON as a file. Every line breaks where it should.</p>
</div>
<div class="page"><div class="bar"><i></i><i></i><i></i><span>Components / Button</span></div><div class="doc" id="doc"></div></div>
<script src="plugin.js"></script>
<script>
// Minimal Markdown → HTML, enough for the plugin's output (headings, lists, hard breaks, bold, code)
const inline = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
const html = MD.trim().split(/\n{2,}/).map((block) => {
  if (block.startsWith('## ')) {
    const [h, ...rest] = block.split('\n');
    const head = `<h2>${inline(h.slice(3))}</h2>`;
    if (!rest.length) return head;
    if (rest.every((l) => l.startsWith('- '))) return head + '<ul>' + rest.map((l) => `<li>${inline(l.slice(2))}</li>`).join('') + '</ul>';
    return head + `<p>${rest.join('\n').split('  \n').map(inline).join('<br>')}</p>`;
  }
  if (block.startsWith('# ')) return `<h1>${inline(block.slice(2))}</h1>`;
  return `<p>${block.split('  \n').map(inline).join('<br>')}</p>`;
}).join('');
document.getElementById('doc').innerHTML = html;
pluginWindow({ x: 1236 - 40 - 320 * 1.2, y: 540 - 600 * 1.2 / 2, scale: 1.2, theme: 'light', status: '📋 Copied to clipboard' });
</script>
</body></html>
