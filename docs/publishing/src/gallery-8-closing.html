<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
/* Bookend to the cover: same violet, same mark, everything on the centre axis (x = 960, block centred on y = 540) */
body{background:linear-gradient(180deg,#6A4DFA 0%,#4B2FE2 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(1100px 700px at 50% 0%,rgba(255,255,255,.14),transparent 70%)}
.block{position:relative;display:flex;flex-direction:column;align-items:center}
.mark{width:140px;display:block;margin-bottom:60px}
h1{color:#fff;font-size:96px;letter-spacing:-0.035em}
.lede{color:rgba(255,255,255,.78);font-size:34px;margin-top:36px}
.link{margin-top:64px;display:inline-flex;align-items:center;gap:12px;padding:16px 26px;border-radius:999px;background:rgba(255,255,255,.12);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);font:500 22px/1 Inter;color:#fff;letter-spacing:-0.005em}
.link span{color:rgba(255,255,255,.66)}
</style></head><body>
<div class="block">
  <img class="mark" src="mark-onviolet.svg" alt="">
  <h1>Your components,<br>documented.</h1>
  <p class="lede">Markdown or JSON. One component, or the whole file.</p>
  <div class="link">Open source<span>·</span>github.com/maxavend/export-component-metadata</div>
</div>
</body></html>
